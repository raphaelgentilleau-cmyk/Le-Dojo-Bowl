<body>
<div id="app">
<style>
#app{
 --pap:#EFF1FC;--card:#FFFFFF;--ink:#16132B;--soft:#7B79A4;--line:#DDDEF2;--card2:#FFFFFF;
 --a1:#00A98D;--a2:#E01B6E;--a3:#6C3BF5;--a4:#E8A302;--bad:#E01B6E;
 font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:linear-gradient(180deg,#F2E7D5 0%,#0E1014 40%,#10131A 100%);color:var(--ink);display:block;max-width:560px;margin:0 auto;
 padding:14px 16px 82px;font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation;}
#app *{box-sizing:border-box;}
#app button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
#app input,#app select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;}
#app .num{font-variant-numeric:tabular-nums;}
#app .lab{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);}
#app .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
#app .sec{margin-bottom:26px;}
#app hr{border:none;border-top:1px solid var(--line);margin:18px 0;}

/* entete */
#app .head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;}
#app .head .sc{font-size:52px;font-weight:300;letter-spacing:-.05em;line-height:.9;}
#app .head .sc s{font-size:14px;text-decoration:none;color:var(--soft);}
#app .head .rt{text-align:right;}

/* jauges */
#app .gz{display:flex;gap:22px;justify-content:space-between;}
#app .g{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
#app .tb{width:15px;height:86px;border-radius:2px;background:#E7E9F8;position:relative;overflow:hidden;}
#app .tb i{position:absolute;left:0;right:0;bottom:0;transition:height .25s ease;}
#app .tb.dr{width:16px;}
#app .g .v{font-size:13px;font-weight:600;}
#app .g .n{font-size:10px;color:var(--soft);}
#app .steps{display:flex;gap:8px;justify-content:center;margin-top:12px;}
#app .st{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--soft);}

/* repas */
#app .h2{font-size:15px;font-weight:650;margin-bottom:12px;}
#app .mrow{display:flex;gap:6px;}
#app .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;}
#app .m .ic{width:100%;aspect-ratio:1;max-width:46px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);
 display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;}
#app .m.on .ic{border-color:var(--a1);background:var(--tint,#F4F4F6);}
#app .m.on .ic:after{content:"✓";position:absolute;right:-3px;top:-3px;width:15px;height:15px;border-radius:99px;background:var(--a1);color:var(--sura,#fff);font-size:9px;display:flex;align-items:center;justify-content:center;}
#app .m.sel .ic{border-color:var(--ink);border-width:2px;}
#app .m .h{font-size:9.5px;color:var(--soft);}
#app .mtitle{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 10px;}
#app .mtitle b{font-size:15px;font-weight:650;}
#app .mtitle span{font-size:11.5px;color:var(--soft);}
#app .fg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}

function offMin(per){if(per==='tout')return 0;const dbt=debutSuivi()||cle();let o=0;
 while(o>-600&&bornes(per,o-1).fin>=dbt)o--;return o;}
function libPer(){return BB?BB.lib.toLowerCase():'';}
function dansPer(k){const b=BB||bornes(bilPer,bilOff);return k>=b.deb&&k<=b.fin&&k<=cle();}
function dansB(k,b){return k>=b.deb&&k<=b.fin&&k<=cle();}
function mesure(b){
 const se=(S.seances||[]).filter(e=>dansB(e.d,b)),co=(S.courses||[]).filter(c=>dansB(c.d,b));
 const jm={};se.forEach(e=>jm[e.d]=1);
 Object.keys(S.valid||{}).forEach(k=>{if(dansB(k,b)&&S.valid[k].muscu)jm[k]=1;});
 const po=(S.poids||[]).filter(p=>dansB(p.d,b)).sort((x,y)=>x.d<y.d?-1:1);
 const km=Math.round(co.reduce((a,c)=>a+(+c.km||0),0)*10)/10;
 const ch=co.filter(c=>(+c.km||0)>0&&(+c.min||0)>0);
 const vitDe=q=>{const a=q.reduce((x,c)=>x+(+c.km),0),b=q.reduce((x,c)=>x+(+c.min),0);
  return b>0?Math.round(a/(b/60)*10)/10:null;};
 const allDe=q=>{const a=q.reduce((x,c)=>x+(+c.km),0),b=q.reduce((x,c)=>x+(+c.min),0);
  return a>0?b/a:null;};
 return {seances:Object.keys(jm).length,exos:se.length,
  tonnage:Math.round(se.reduce((a,e)=>a+e.w*e.s*e.r,0)),
  sorties:co.length,km:km,
  lng:co.length?Math.max.apply(null,co.map(c=>+c.km||0)):0,
  moy:co.length?Math.round(km/co.length*10)/10:0,
  chrono:ch.length,
  vit:vitDe(ch),all:allDe(ch),
  vitc:vitDe(ch.filter(c=>+c.km<10)),nbc:ch.filter(c=>+c.km<10).length,allc:allDe(ch.filter(c=>+c.km<10)),
  vitl:vitDe(ch.filter(c=>+c.km>=10)),nbl:ch.filter(c=>+c.km>=10).length,alll:allDe(ch.filter(c=>+c.km>=10)),
  pfin:po.length?po[po.length-1].kg:null,pdeb:po.length?po[0].kg:null};}
function delta(v,p,unite,neutre){
 if(!PB||bilPer==='tout'||p===null||p===undefined||v===null)return '';
 const d=Math.round((v-p)*10)/10;
 const c=neutre||d===0?'var(--soft)':(d>0?'var(--pok)':'var(--pbad)');
 return '<em class="dlt" style="color:'+c+'">'+(d>0?'+':'')+String(d).replace('.',',')+(unite||'')+'</em>';}
function sousPeriodes(){
 // la periode affichee est decoupee en tranches plus fines
 const b=BB||bornes(bilPer,bilOff),out=[];
 const D=k=>{const q=k.split('-');return new Date(+q[0],+q[1]-1,+q[2],12);};
 if(bilPer==='sem')return {l:[],nom:'jour'};
 if(bilPer==='mois'){const d0=D(b.deb),df=D(b.fin);
  const auj=cle();
  let cur=new Date(d0);
  const M3=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  while(cur<=df){const fin=new Date(cur);
   fin.setDate(cur.getDate()+(6-((cur.getDay()+6)%7)));
   if(fin>df)fin.setTime(df.getTime());
   const kd2=isoD(cur);
   if(kd2>auj)break; // on n affiche pas les semaines pas encore commencees
   out.push({l:cur.getDate()+' '+M3[cur.getMonth()],b:{deb:kd2,fin:isoD(fin)}});
   cur=new Date(fin);cur.setDate(fin.getDate()+1);}
  return {l:out,nom:'semaine'};}
 if(bilPer==='annee'){const M2=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  const y=+b.deb.slice(0,4);
  for(let m=0;m<12;m++){const a=new Date(y,m,1,12),z=new Date(y,m+1,0,12);
   out.push({l:M2[m],b:{deb:isoD(a),fin:isoD(z)}});}
  return {l:out,nom:'mois'};}
 // tout : une tranche par annee suivie
 const y0=+(debutSuivi()||cle()).slice(0,4),y1=+cle().slice(0,4);
 for(let y=y0;y<=y1;y++)out.push({l:String(y),b:{deb:y+'-01-01',fin:y+'-12-31'}});
 return {l:out,nom:'année'};}
function serieEvo(fn){
 const sp=sousPeriodes();
 return sp.l.map(x=>({l:x.l,v:fn(mesure(x.b)),o:0}));}
function evo(titre,fn,unite,coul,ligne){
 const sp=sousPeriodes();
 if(!sp.l.length)return '';
 const sr=sp.l.map(x=>({l:x.l,v:fn(mesure(x.b))}));
 if(sr.length<2)return '';
 const nn=sr.filter(x=>x.v!==null&&x.v!==undefined&&x.v!==0);
 if(nn.length<2)return '';
 const tete='<div class="evt"><span class="lab">'+titre+' par '+sp.nom+'</span></div>';
 if(ligne){const pts=sr.filter(x=>x.v!==null&&x.v!==undefined);
  if(pts.length<2)return '';
  const W=320,H=104,mn=Math.min.apply(null,pts.map(x=>x.v)),mx=Math.max.apply(null,pts.map(x=>x.v)),mg=Math.max(.5,(mx-mn)*.2);
  const y0=mn-mg,y1=mx+mg,px=i2=>18+i2*(W-36)/(sr.length-1),py=v=>14+(1-(v-y0)/(y1-y0))*(H-38);
  let g='',d='';sr.forEach((x,i2)=>{g+='<text x="'+px(i2)+'" y="'+(H-4)+'" font-size="8" fill="var(--soft)" text-anchor="middle">'+x.l+'</text>';
   if(x.v!==null&&x.v!==undefined){d+=(d?' L':'M')+px(i2)+' '+py(x.v);
    g+='<circle cx="'+px(i2)+'" cy="'+py(x.v)+'" r="'+(i2===sr.length-1?4:2.6)+'" fill="'+coul+'"/>'
     +'<text x="'+px(i2)+'" y="'+(py(x.v)-7)+'" font-size="8.5" font-weight="700" fill="'+coul+'" text-anchor="middle">'+String(x.v).replace('.',',')+'</text>';}});
  return tete+'<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block"><path d="'+d+'" fill="none" stroke="'+coul+'" stroke-width="2" stroke-linejoin="round"/>'+g+'</svg>';}
 return tete+barres(sr.map(x=>x.v||0),sr.map(x=>x.l),coul,320,104);}

function courbe(pts,W,H,couleur,libMin,libMax){
 if(pts.length<2)return '<div class="ln">Pas encore assez de relevés.</div>';
 const xs=pts.map(p=>new Date(p.d+'T12:00:00').getTime()),ys=pts.map(p=>p.v);
 const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
 let y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
 const mg=Math.max(0.5,(y1-y0)*0.18);y0-=mg;y1+=mg;
 const px=t=>(x1===x0?0:(t-x0)/(x1-x0))*(W-46)+38;
 const py=v=>10+(1-(v-y0)/(y1-y0))*(H-26);
 const d=pts.map((p,i)=>px(xs[i])+','+py(p.v)).join(' ');
 const der=pts[pts.length-1];
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'
  +'<line x1="38" y1="'+py(y1-mg)+'" x2="'+(W-6)+'" y2="'+py(y1-mg)+'" stroke="var(--line)" stroke-width="1"/>'
  +'<line x1="38" y1="'+py(y0+mg)+'" x2="'+(W-6)+'" y2="'+py(y0+mg)+'" stroke="var(--line)" stroke-width="1"/>'
  +'<text x="2" y="'+(py(y1-mg)+3)+'" font-size="9" fill="var(--soft)">'+(libMax||String(Math.round((y1-mg)*10)/10).replace('.',','))+'</text>'
  +'<text x="2" y="'+(py(y0+mg)+3)+'" font-size="9" fill="var(--soft)">'+(libMin||String(Math.round((y0+mg)*10)/10).replace('.',','))+'</text>'
  +'<polyline points="'+d+'" fill="none" stroke="'+couleur+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
  +'<circle cx="'+px(xs[xs.length-1])+'" cy="'+py(der.v)+'" r="3.4" fill="'+couleur+'"/>'
  +'</svg>';}

function barres(vals,libs,couleur,W,H){
 if(!vals.length||!vals.some(v=>v>0))return '<div class="ln">Rien sur cette période.</div>';
 const mx=Math.max.apply(null,vals),bw=W/vals.length,BAS=H-20,HAUT=20;
 const pt=vals.length>8?7:8.5;
 let g='<line x1="0" y1="'+BAS+'" x2="'+W+'" y2="'+BAS+'" stroke="var(--line)" stroke-width="1"/>';
 vals.forEach((v,i)=>{const hh=v>0?Math.max(4,(BAS-HAUT)*v/mx):0;
  const cx=i*bw+bw/2;
  if(hh)g+='<rect x="'+(cx-Math.min(22,bw*0.32))+'" y="'+(BAS-hh)+'" width="'+(Math.min(22,bw*0.32)*2)+'" height="'+hh+'" rx="3" fill="'+couleur+'" opacity="'+(i===vals.length-1?'1':'.45')+'"/>';
  g+='<text x="'+cx+'" y="'+(H-6)+'" font-size="'+pt+'" fill="var(--soft)" text-anchor="middle">'+libs[i]+'</text>';
  if(v>0)g+='<text x="'+cx+'" y="'+(BAS-hh-5)+'" font-size="'+(pt+1)+'" font-weight="800" fill="var(--ink)" text-anchor="middle">'+String(Math.round(v*10)/10).replace('.',',')+'</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible">'+g+'</svg>';}

function premierJour(){

const CALMAX=550;
function etendue(){

  const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const pts=marqueur(k)||[];
  if(d.getDate()===1||i===N-1)cells+='<div class="mois">'+M1[d.getMonth()]+'<br><span>'+String(d.getFullYear()).slice(2)+'</span></div>';

   +'</button>';}
 const dj=new Date(Date.now()-108e5);
 return '<div class="hist"><div class="calhd"><b id="calmois">'+MOIS[dj.getMonth()]+' '+dj.getFullYear()+'</b>'

function setPal(id,T){const x=S.exos.find(e=>e.id===id);if(!x)return;
 const pos=Math.max(0,TRACK.indexOf(x.r)),actuel=pos*NEED+x.v;
 if(T<0)T=0;
 const rAv=x.r,wAv=x.w;
 if(T>actuel){
  S.seances.push({d:cle(),id:x.id,g:x.g,n:x.n,w:x.w,s:x.s,r:x.r,t:Math.round(x.w*x.s*x.r)});
  if(S.seances.length>500)S.seances=S.seances.slice(-500);
  x.last=cle();S.xp+=10;S.stats.series++;
  const hh=new Date().getHours();if(hh<7&&hh>=4)S.stats.aube=1;if(hh>=0&&hh<4)S.stats.minuit=1;
  burst(LX,LY,'#2FBE92',9);texte(LX,LY,'+1 serie','#2FBE92');vibre(12);}
 else if(T<actuel){S.stats.recul++;
  for(let i=S.seances.length-1;i>=0;i--){if(S.seances[i].id===x.id){S.seances.splice(i,1);break;}}}
 if(T>=TRACK.length*NEED){x.w=Math.round((x.w+x.pas)*100)/100;x.r=TRACK[0];x.v=0;S.xp+=30;
  x.up=(x.up||0)+1;S.stats.montees++;S.stats.paliers++;chip('+'+x.pas+' kg · '+x.n,'#FF3D8B');burst(LX,LY,'#FF3D8B',12);vibre([15,30,30]);}
 else{x.r=TRACK[Math.floor(T/NEED)];x.v=T%NEED;
  if(T>actuel&&x.r!==rAv){S.stats.paliers++;chip('palier '+x.s+' x '+x.r,'#22E6C8');burst(LX,LY,'#22E6C8',10);vibre([12,25,12]);}}
 save();render();}

   bx(vide?'Restaurer une sauvegarde':'Sauvegarde et restauration',corps,pieds);break;}
  case 'copiesv':{const t2=document.getElementById('sv_txt');if(t2){t2.focus();t2.select();
    let done=false;
    try{done=document.execCommand&&document.execCommand('copy');}catch(e){}
    if(!done&&navigator.clipboard){navigator.clipboard.writeText(t2.value).then(()=>{
      const m=document.getElementById('sv_msg');if(m)m.textContent='Copié. Colle-le dans une note.';}).catch(()=>{});}
    else{const m=document.getElementById('sv_msg');
     if(m)m.textContent=done?'Copié. Colle-le dans une note.':'Sélection faite, utilise Copier du clavier.';}}
   break;}
  case 'restaure':{const m=document.getElementById('sv_msg');
   try{const o=JSON.parse(document.getElementById('sv_txt').value);
    if(o&&typeof o==='object'&&(o.jours||o.poids||o.exos)){
     S=o;normalise();cloture();flushNow();fermer();render();
     banniere('Sauvegarde restaurée, '+(S.seances||[]).length+' exercices et '+(S.courses||[]).length+' sorties','#1D9A5F');}
    else if(m)m.textContent='Ce texte ne ressemble pas à une sauvegarde.';}
   catch(e){if(m)m.textContent='Texte illisible. Colle la sauvegarde complète, des accolades au début et à la fin.';}
   break;}
  case 'poids':{const dj=S.poids.find(x=>x.d===cle());bx('Mon poids',IN('p_kg','Kilos','','number')
   +(dj?'<div class="ln" style="color:var(--ink)">Tu as déjà noté <b>'+String(dj.kg).replace('.',',')+' kg</b> aujourd’hui. La nouvelle valeur le remplacera, un seul poids est gardé par jour.</div>'
       :'<div class="ln">Dernier relevé '+String(S.poids[S.poids.length-1].kg).replace('.',',')+' kg le '+courte(S.poids[S.poids.length-1].d)+'</div>'),
   '<button class="cta" data-act="poidsOk">'+(dj?'Remplacer':'Enregistrer')+'</button><button class="gh" data-act="fermer">Annuler</button>');break;}
  case 'poidsOk':{const k=gn('p_kg');if(k>0){const t=cle(),e2=S.poids.find(p=>p.d===t);
   if(e2)e2.kg=k;else S.poids.push({d:t,kg:k});S.poids.sort((a,b2)=>a.d<b2.d?-1:1);save();}fermer();render();break;}
  case 'objpoids':bx('Objectif de poids',
   '<div class="ln" style="margin-bottom:12px">Un objectif est facultatif. S’il est défini, il apparaît '
   +'en pointillés sur ta courbe de poids.</div>'
   +IN('o_kg','Poids visé en kg',S.objPoids>0?S.objPoids:'','number'),
   '<button class="cta" data-act="objpoidsOk">Enregistrer</button>'
   +(S.objPoids>0?'<button class="gh" data-act="objpoidsNon">Retirer mon objectif</button>':'')
   +'<button class="gh" data-act="fermer">Annuler</button>');break;
  case 'objpoidsOk':{const v=gn('o_kg');
   if(!(v>0)){chip('Indique un poids, ou retire ton objectif','#D1344B');break;}
   S.objPoids=v;save();fermer();chip('Objectif fixé à '+String(v).replace('.',',')+' kg',PAL().ok);render();break;}
  case 'objpoidsNon':S.objPoids=null;save();fermer();chip('Objectif retiré',PAL().soft);render();break;
  case 'newexo':bxExo(null);break;
  case 'exoOk':{const id=d.id,nom=gv('x_n');if(!nom){fermer();break;}
   if(id){const x=S.exos.find(z=>z.id===id);const rAv=x.r;
    x.n=nom;x.g=gv('x_g');x.w=gn('x_w');x.s=gn('x_s')||4;x.r=gn('x_r')||TRACK[0];x.pas=gn('x_pas')||2.5;
    if(x.r!==rAv)x.v=0;}
   else{const x=X(gv('x_g'),nom,gn('x_w'),gn('x_s'),gn('x_r'));x.pas=gn('x_pas')||2.5;
    while(S.exos.some(z=>z.id===x.id))x.id+='-2';S.exos.push(x);S.groupe=x.g;S.stats.newEx++;}
   save();fermer();render();break;}
  case 'supOk':S.exos=S.exos.filter(z=>z.id!==d.id);
   S.stats.supEx++;det=null;save();fermer();render();break;
  case 'supTout':S.exos=S.exos.filter(z=>z.id!==d.id);
   S.seances=S.seances.filter(z=>z.id!==d.id);
   S.stats.supEx++;det=null;save();fermer();render();break;}});

let dr=null;
function setY(el,y,t){const r=el.getBoundingClientRect();let pc=1-(y-r.top)/r.height;pc=Math.max(0,Math.min(1,pc));
 const j=J();if(t==='eau')j.eau=Math.round(pc*S.eau/250)*250;else j.dodo=Math.round(pc*11*2)/2;save();render();}
APP.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-dr]');if(!t)return;dr=t.dataset.dr;setY(t,e.clientY,dr);e.preventDefault();});
let lpT=null,lpOk=false,lpX=0,lpY=0;
function lpStop(){clearTimeout(lpT);lpT=null;}
APP.addEventListener('pointerdown',e=>{const f=e.target.closest('[data-food]');if(!f)return;
 lpOk=false;lpX=e.clientX;lpY=e.clientY;lpStop();
 const k=parseInt(f.dataset.food,10);
 lpT=setTimeout(()=>{lpT=null;lpOk=true;vibre(25);bxQte(k);},450);},true);
APP.addEventListener('pointermove',e=>{if(!lpT)return;
 if(Math.abs(e.clientX-lpX)>12||Math.abs(e.clientY-lpY)>12)lpStop();},true);
APP.addEventListener('pointerup',lpStop,true);
APP.addEventListener('pointercancel',()=>{lpStop();lpOk=false;},true);
window.addEventListener('pointermove',e=>{if(!dr)return;const l=document.querySelector('[data-dr="'+dr+'"]');if(l)setY(l,e.clientY,dr);});
window.addEventListener('pointerup',()=>dr=null);
setInterval(()=>{const k=cle();if(jc&&k!==jc){jc=k;det=null;render();}jc=k;},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S){const k=cle();if(k!==jc){jc=k;det=null;}render();}});
load().then(()=>{jc=cle();J();render();});
})();
